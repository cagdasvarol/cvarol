<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dönem Filmi Cast (Oyuncu) Başvuru Formu</title>
</head>
<body>
    <header>
        <h1>19. Yüzyıl Dönem Filmi - Oyuncu ve Figüran Başvuru Formu</h1>
    </header>

    <main>
    <form>
        <h2><u>Kişisel Bilgiler</u></h2>

            <label><b>Adınız Soyadınız:</b></label><br>
            <input type="text" required><br>

        <h2><u>Geleneksel Yetenekler</u></h2>

            <input type="checkbox">
            <label>Binicilik</label><br>

            <input type="checkbox">
            <label>Eskrim</label><br>

            <input type="checkbox">
            <label>Vals</label><br>

            <input type="checkbox">
            <label>Dövüş Sanatları</label><br>

        <h2><u>Aksan / Şive Bilgisi</u></h2>

            <input type="radio">
            <label>İstanbul Türkçesi</label><br>

            <input type="radio">
            <label>Anadolu Şivesi</label><br>

            <input type="radio">
            <label>Yabancı Aksan</label><br>

        <h2><u>Saç / Sakal Durumu</u></h2>

            <input type="radio">
            <label>Doğal</label><br>

            <input type="radio">
            <label>Sakallı</label><br>

            <input type="radio">
            <label>Peruk / Protez Kullanabilirim.</label><br>

        <h2><u>Kostüm Ölçüleri:</u></h2>

        <label>Boy (cm):</label>
        <input type="number" min="160" max="200" required><br><br>

        <label>Beden:</label>
        <input type="number" min="34" max="50" required><br><br>

        <label>Ayak Numarası:</label>
        <input type="number" min="30" max="50" required><br>

        <h2><u>Eski Dönem Tiyatrosu Tecrübeleri:</u></h2>

        <textarea rows="6" cols="50" maxlength="500" placeholder="Eski dönem tiyatrosu veya tarihi yapımlardaki deneyimlerinizi en fazla 500 karakter ile yazınız."></textarea>
        <br><br>
            
        <button type="submit">Başvuruyu Gönder</button>
        <button type="reset">Formu Temizle</button>
    </form>
    </main>    
</body>
</html>
